<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Controllo layout mobile · Demiguise</title>
  <style>
    body { margin: 16px; background: #f0f1f5; color: #202235; font: 16px system-ui; }
    main { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    section { margin: 0; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; }
    iframe { display: block; border: 0; height: 820px; background: #111525; }
  </style>
</head>
<body>
  <h1>Controllo layout mobile</h1>
  <p>La pagina reale in tre finestre da 360, 390 e 430 px. Usa un archivio di prova separato, senza importare le spunte di Ele o Thom.</p>
  <main>
    <section><h2>360 px</h2><iframe title="360 px" width="360"></iframe></section>
    <section><h2>390 px</h2><iframe title="390 px" width="390"></iframe></section>
    <section><h2>430 px</h2><iframe title="430 px" width="430"></iframe></section>
  </main>
  <script>
    const requested = new URLSearchParams(location.search).get('verifica');
    const id = /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(requested || '') ? requested : crypto.randomUUID();
    document.querySelectorAll('iframe').forEach(frame => { frame.src = './index.html?verifica=' + id; });
  </script>
</body>
</html>
